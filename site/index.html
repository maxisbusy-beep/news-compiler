<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Headlines from outlets across the political spectrum, grouped into stories with a neutral headline.">
  <title>News Compiler</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icons/icon-192.png">
  <link rel="apple-touch-icon" href="app-icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="#">News Compiler</a>
      <div class="tools">
        <button type="button" class="icon-btn" id="search-btn" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        </button>
        <a class="icon-btn" href="#/settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </a>
      </div>
    </div>
    <form class="search" id="search" hidden role="search">
      <input id="q" type="search" placeholder="Search headlines" autocomplete="off" aria-label="Search headlines">
    </form>
    <nav class="chips" id="chips" aria-label="Filter stories"></nav>
  </header>
  <div class="pull" id="pull" aria-hidden="true">Release to refresh</div>
  <main id="view" tabindex="-1"></main>
  <noscript><p class="empty">This app needs JavaScript to load the stories.</p></noscript>
  <script src="app.js"></script>
</body>
</html>

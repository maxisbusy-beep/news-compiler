name: probe-feeds

# Phase 2 helper: test candidate feeds and fetch outlet icons from GitHub's network.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests pillow
      - run: python pipeline/tools/probe_feeds.py pipeline/tools/feed_candidates.json probe-out
      - name: Push results to the probe-results branch
        run: |
          cd probe-out
          git init -q -b probe-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Probe results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results

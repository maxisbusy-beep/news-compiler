name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      NC_MODELS_DIR: ${{ github.workspace }}/.models
      NC_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .models
          key: models-v1
      - run: pytest -q -rs --ignore=tests/test_ui.py

  ui:
    runs-on: ubuntu-latest
    env:
      NC_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest playwright numpy
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -rs tests/test_ui.py

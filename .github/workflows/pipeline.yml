name: pipeline

# Every 30 minutes: fetch, dedupe, translate, group, write headlines, publish.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NC_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .models
          key: models-v2-gguf
          restore-keys: models-v1

      # Private working data (raw items incl. RSS descriptions, ETags, centroids)
      # lives in the Actions cache, never in the repo or on Pages.
      - uses: actions/cache/restore@v4
        with:
          path: work
          key: pipeline-work-${{ github.run_id }}
          restore-keys: pipeline-work-

      - name: Run pipeline
        run: python -m pipeline.run --data-dir work

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work
          key: pipeline-work-${{ github.run_id }}

      - name: Publish data into the site
        run: python -m pipeline.publish --data-dir work --site site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
